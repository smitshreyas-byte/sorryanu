<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>A Letter For Anu ❤️</title>


<link rel="stylesheet" href="style.css">


<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">


<style>


.envelope-area{

display:flex;

justify-content:center;

align-items:center;

margin:40px auto;

cursor:pointer;

}



.envelope{


position:relative;

width:260px;

height:180px;


background:#f8d7da;


border-radius:10px;


box-shadow:

0 20px 40px rgba(0,0,0,.25);


transition:1s;


}



.envelope:before{


content:"";


position:absolute;


top:0;

left:0;


border-left:130px solid transparent;

border-right:130px solid transparent;

border-top:100px solid #e5989b;


transform-origin:top;


transition:1s;


}



.envelope.open:before{


transform:rotateX(180deg);


}




.letter{


position:absolute;


background:white;


color:#7a284b;


width:220px;


height:150px;


left:20px;


top:20px;


padding:20px;


border-radius:10px;


text-align:center;


font-size:14px;


opacity:0;


transform:translateY(40px);


transition:1s;


}



.envelope.open .letter{


opacity:1;


transform:translateY(-80px);


}





.small-heart{


font-size:60px;

animation:softBeat 2s infinite;


}





</style>


</head>



<body>



<div class="container">



<div class="small-heart">

❤️

</div>




<h1>

A Letter For You

</h1>




<div class="message">

Click the envelope...

I wrote something from my heart.

</div>





<div class="envelope-area" onclick="openLetter()">



<div class="envelope" id="envelope">



<div class="letter">


My Dear Anu ❤️


<br><br>


I have something important

to tell you...



</div>



</div>



</div>






<div class="message" id="text" style="display:none;">



Sometimes one mistake can hurt someone

we love the most.


<br><br>


I want you to know that your feelings

matter to me.


</div>






<button onclick="nextPage()">

Read My Heart 💔

</button>




</div>








<script>





function openLetter(){


document
.getElementById("envelope")
.classList.add("open");



document
.getElementById("text")
.style.display="block";


}





function nextPage(){


window.location.href="page3.html";


}







function createPetal(){


let p=document.createElement("div");


p.className="petal";


p.innerHTML="🌹";


p.style.left=Math.random()*100+"%";


p.style.animationDuration=

(8+Math.random()*8)+"s";



document.body.appendChild(p);



setTimeout(()=>{


p.remove();


},16000);


}



setInterval(createPetal,1000);




</script>



</body>

</html>
